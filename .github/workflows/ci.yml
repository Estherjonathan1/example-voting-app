name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start the stack (hardened images)
        run: docker compose -f result/docker-compose.test.yml up -d --build vote result worker redis db

      - name: Smoke test (vote -> redis -> worker -> db, result page up)
        run: |
          C="docker compose -f result/docker-compose.test.yml"
          for i in $(seq 1 30); do
            $C exec -T vote curl -sf http://localhost:80 > /dev/null && break
            sleep 2
          done
          $C exec -T vote curl -sS -X POST --data "vote=b" http://localhost:80 > /dev/null
          COUNT=0
          for i in $(seq 1 15); do
            COUNT=$($C exec -T db psql -U postgres -tAc "SELECT COUNT(*) FROM votes" 2>/dev/null || echo 0)
            [ "$COUNT" = "1" ] && break
            sleep 2
          done
          echo "Votes saved in database: $COUNT"
          [ "$COUNT" = "1" ]
          $C exec -T result curl -sf http://localhost:80 > /dev/null
          echo "Smoke test passed"

      - name: Show logs if something failed
        if: failure()
        run: docker compose -f result/docker-compose.test.yml logs

      - name: Stop the stack
        if: always()
        run: docker compose -f result/docker-compose.test.yml down -v

  build-scan-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [vote, result, worker]
    steps:
      - uses: actions/checkout@v4

      - name: Set image name (tagged with the commit SHA)
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE=ghcr.io/${OWNER}/voting-app-${{ matrix.service }}:${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Build image
        run: docker build -t "$IMAGE" ./${{ matrix.service }}

      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.IMAGE }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push image
        if: github.event_name == 'push'
        run: docker push "$IMAGE"
